<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Моя перша HTML-форма</title>
  </head>
  <body>
    <h1>Моя перша HTML-форма</h1>

    <form method="POST" action="https://httpbin.org/post">
      <p>
        <label for="name">Ім'я:</label>
        <input type="text" id="name" name="name" />
      </p>

      <p>
        <label>
          Дата народження:
          <input type="date" name="birthdate" />
        </label>
      </p>

      <p>
        <label for="email">Імейл:</label>
        <input type="email" id="email" name="email" />
      </p>

      <p>
        <label for="message">Повідомлення:</label>
        <textarea id="message" name="message" rows="4" cols="40"></textarea>
      </p>

      <fieldset>
        <legend>Ваші улюблені напої?</legend>
        <label
          ><input type="checkbox" name="drink" value="coffee" /> Кава</label
        >
        <label><input type="checkbox" name="drink" value="tea" /> Чай</label>
        <label><input type="checkbox" name="drink" value="juice" /> Сік</label>
        <label><input type="checkbox" name="drink" value="water" /> Вода</label>
      </fieldset>

      <fieldset>
        <legend>Моя національність</legend>
        <label
          ><input type="radio" name="nationality" value="ukrainian" />
          Українець</label
        >
        <label
          ><input type="radio" name="nationality" value="slovak" />
          Словак</label
        >
        <label
          ><input type="radio" name="nationality" value="hungarian" />
          Угорець</label
        >
      </fieldset>

      <p>
        <button type="submit">Надіслати</button>
        <button type="reset">Очистити</button>
      </p>
    </form>

    <picture>
      <source
        media="(max-width: 467px)"
        srcset="https://picsum.photos/300/500"
      />
      <img
        src="https://picsum.photos/1000/400"
        alt="Демонстраційне зображення"
        style="max-width: 100%; height: auto"
      />
    </picture>
  </body>
</html>
